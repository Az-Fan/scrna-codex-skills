[workspace]
authors = ["JarningGau <jarninggau@gmail.com>"]
channels = [
    "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge",
    "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/bioconda",
]
name = "04-grn"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[tasks.init]
cmd = "bash setup-vscode.sh"

[feature.r.dependencies]
r-base = "4.4.3.*"
r-languageserver = ">=0.3.17,<0.4"
r-matrix = ">=1.7_4,<2"
r-seurat = "5.4.0.*"
r-qs = ">=0.27.3,<0.28"
r-arrow = ">=23.0.1,<24"
bioconductor-complexheatmap = ">=2.22.0,<3"
r-circlize = ">=0.4.18,<0.5"
bioconductor-aucell = ">=1.28.0,<2"
bioconductor-clusterprofiler = ">=4.14.0,<5"
r-biocmanager = ">=1.30.27,<2"
r-ggraph = ">=2.2.2,<3"
r-ggsci = ">=5.0.0,<6"
r-transport = ">=0.15_4,<0.16"
bioconductor-gsva = ">=2.0.0,<3"
r-presto = ">=1.0.0,<2"
r-lme4 = ">=2.0_1,<3"
r-philentropy = ">=0.10.0,<0.11"
r-readr = ">=2.2.0,<3"
r-hmisc = ">=5.2_5,<6"

[feature.pyscenic.dependencies]
pyscenic = ">=0.12.1,<0.13"
setuptools = ">=69,<76"
tbb = ">=2021.6"

[environments]
default = ["r"]
pyscenic = ["pyscenic"]

[dependencies]
bioconductor-genomeinfodbdata = ">=1.2.13,<2"
