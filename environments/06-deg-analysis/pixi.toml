[workspace]
authors = ["JarningGau <jarninggau@gmail.com>"]
channels = [
    "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge",
    "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/bioconda",
]
name = "06-deg-analysis"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[tasks.install-supplemental]
description = "Install checksum-pinned supplemental R packages explicitly"
cmd = "Rscript install_supplemental.R --install"




[feature.r.dependencies]
r-base = "4.4.3.*"
r-languageserver = ">=0.3.17,<0.4"
r-matrix = ">=1.7_4,<2"
r-seurat = "5.4.0.*"
r-qs = ">=0.27.3,<0.28"

# 差异分析核心
bioconductor-deseq2 = ">=1.46.0,<2"
bioconductor-apeglm = ">=1.28.0,<2"
bioconductor-limma = ">=3.62.0,<4"

# 富集分析
bioconductor-clusterprofiler = ">=4.14.0,<5"
"bioconductor-genomeinfodbdata" = ">=1.2.13,<2"
"bioconductor-org.mm.eg.db" = ">=3.20.0,<4"
bioconductor-enrichplot = ">=1.26.0,<2"
r-msigdbr = ">=26.1.0,<27"
bioconductor-reactomepa = ">=1.50.0,<2"

# 可视化
r-ggplot2 = ">=4.0.2,<5"
r-ggrepel = ">=0.9.6,<0.10"
r-patchwork = ">=1.3.0,<2"
r-cowplot = ">=1.1.3,<2"
r-pheatmap = ">=1.0.12,<2"
r-ggsci = ">=3.2.0,<4"
r-rcolorbrewer = ">=1.1_3,<2"
bioconductor-nebulosa = ">=1.16.0,<2"

# 数据处理
r-dplyr = ">=1.1.4,<2"
r-tidyr = ">=1.3.1,<2"
r-stringr = ">=1.5.1,<2"
r-tibble = ">=3.2.1,<4"
r-purrr = ">=1.0.4,<2"
r-readr = ">=2.1.5,<3"

# 输出
r-openxlsx = ">=4.2.8,<5"
r-biocmanager = ">=1.30.27,<2"
r-remotes = ">=2.5.0,<3"

[environments]
default = ["r"]

[dependencies]
