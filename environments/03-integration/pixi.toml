[workspace]
authors = ["JarningGau <jarninggau@gmail.com>"]
channels = [
    "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge",
    "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/bioconda",
]
name = "03-integration"
platforms = ["linux-64"]
version = "0.1.0"
conda-pypi-map = { "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge" = "conda-pypi-map.json" }

[tasks]


[feature.r.dependencies]
r-base = "4.4.3.*"
r-languageserver = ">=0.3.17,<0.4"
r-matrix = ">=1.7_4,<2"
r-rann = ">=2.6.2,<3"
r-ggplot2 = ">=4.0.2,<5"
r-seurat = "5.4.0.*"
r-biocmanager = ">=1.30.27,<2"
"r-data.table" = ">=1.17.8,<2"
r-qs = ">=0.27.3,<0.28"
r-presto = ">=1.0.0,<2"
r-mclust = ">=6.1.2,<7"
r-harmony = ">=1.2.4,<2"
r-dplyr = ">=1.1.4,<2"
r-tidyr = ">=1.3.1,<2"
r-plyr = ">=1.8.9,<2"
r-patchwork = ">=1.3.2,<2"
r-clustree = ">=0.5.1,<0.6"

[feature.scvi.dependencies]
# scib-metrics 0.5.7 result tables require pandas 2.x.
pandas = ">=2.2,<3"
python = "3.12.*"
scvi-tools = ">=1.4.2,<2"
scikit-misc = ">=0.5.2,<0.6"
bbknn = ">=1.6.0,<2"
python-igraph = ">=1.0.0,<2"
leidenalg = ">=0.11.0,<0.12"
ipykernel = ">=7.2.0,<8"

[feature.scvi.pypi-dependencies]
scib-metrics = "==0.5.7"

[environments]
default = ["r"]
scvi = ["scvi"]

[dependencies]
