[workspace]
authors = ["JarningGau <jarninggau@gmail.com>"]
channels = [
    "https://conda.anaconda.org/conda-forge",
    "https://conda.anaconda.org/bioconda",
]
name = "01-scrna-qc"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[tasks.install-supplemental]
description = "Install checksum-pinned supplemental R packages explicitly"
cmd = "Rscript install_supplemental.R --install"



[feature.r.dependencies]
r-base = "4.4.3.*"
r-languageserver = ">=0.3.17,<0.4"
r-matrix = ">=1.7_4,<2"
r-rann = ">=2.6.2,<3"
r-ggplot2 = ">=4.0.2,<5"
r-seurat = "5.4.0.*"
bioconductor-celda = ">=1.22.0,<2"
r-biocmanager = ">=1.30.27,<2"
r-hdf5r = ">=1.3.12,<2"
r-qs = ">=0.27.3,<0.28"

[feature.star]
platforms = ["linux-64"]

[feature.star.dependencies]
star = "==2.7.9a"
sra-tools = ">=3.2.1,<4"

[environments]
default = ["r"]
star = ["star"]
